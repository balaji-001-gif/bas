{% extends "templates/web.html" %}

{% block header %}
<link rel="manifest" href="/assets/bas/manifest.json">
<meta name="theme-color" content="#1a1c23">
<style>
    :root {
        --primary: #6366f1;
        --primary-glow: rgba(99, 102, 241, 0.4);
        --bg-dark: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #10b981;
        --danger: #ef4444;
    }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding-bottom: 90px;
        overflow-x: hidden;
    }

    .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .header-section {
        padding: 40px 24px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .user-greeting h1 {
        font-size: 28px;
        margin: 4px 0 0;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(to right, #fff, #94a3b8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .user-greeting p {
        color: var(--text-muted);
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        margin: 0;
    }

    .pwa-install-badge {
        display: none;
        background: rgba(99, 102, 241, 0.15);
        color: #818cf8;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid rgba(99, 102, 241, 0.3);
        cursor: pointer;
        animation: pulse 2s infinite;
        margin-left: 10px;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
        100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }

    .avatar-ring {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3px;
        box-shadow: 0 0 20px var(--primary-glow);
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #1e293b;
        object-fit: cover;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 0 24px;
    }

    .check-in-btn {
        width: 100%;
        padding: 20px;
        border-radius: 20px;
        border: none;
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        color: white;
        font-weight: 700;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        box-shadow: 0 10px 25px -5px var(--primary-glow);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .check-in-btn:active {
        transform: scale(0.96);
    }

    .check-in-btn.checked {
        background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
        box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.4);
    }

    .bottom-nav {
        position: fixed;
        bottom: 24px;
        left: 24px;
        right: 24px;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        display: flex;
        justify-content: space-around;
        padding: 18px;
        z-index: 1000;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .nav-item {
        color: var(--text-muted);
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        gap: 6px;
        transition: color 0.2s;
    }

    .nav-item.active {
        color: var(--primary);
    }

    .nav-item i {
        font-size: 22px;
    }

    /* Animations */
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .status-badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
        background: rgba(16, 185, 129, 0.1);
        color: var(--accent);
        border: 1px solid rgba(16, 185, 129, 0.2);
    }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="header-section animate-in">
    <div class="user-greeting">
        <p id="current-date">Today, loading...</p>
        <h1 id="user-name">Welcome!</h1>
    </div>
    <div style="display: flex; align-items: center;">
        <div id="install-pwa" class="pwa-install-badge">
            <i class="fas fa-download"></i> Install
        </div>
        <div class="avatar-ring" style="margin-left: 15px;">
            <img id="user-avatar" src="/assets/frappe/images/default-avatar.png" class="avatar-img">
        </div>
    </div>
</div>

<div class="stats-grid animate-in" style="animation-delay: 0.1s">
    <div class="glass-card">
        <p style="color: var(--text-muted); font-size: 13px; font-weight: 600; margin: 0 0 8px;">Status</p>
        <span class="status-badge" id="work-status">Auto</span>
    </div>
    <div class="glass-card">
        <p style="color: var(--text-muted); font-size: 13px; font-weight: 600; margin: 0 0 8px;">Hours</p>
        <h3 style="margin: 0; color: var(--text-main); font-size: 20px; font-weight: 800;">0h 0m</h3>
    </div>
</div>

<div style="padding: 0 24px; margin-top: 10px;" class="animate-in" style="animation-delay: 0.2s">
    <button class="check-in-btn" id="checkin-btn">
        <i class="fas fa-clock"></i>
        <span>Check In</span>
    </button>
</div>

<div style="padding: 24px;" class="animate-in" style="animation-delay: 0.3s">
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.01em;">Activities</h2>
    <div id="activities-container">
        <div class="glass-card" style="display: flex; align-items: center; gap: 16px; opacity: 0.6; padding: 30px; border-style: dashed; background: transparent;">
            <i class="fas fa-calendar-day" style="font-size: 24px;"></i>
            <p style="margin: 0; font-size: 15px; font-weight: 500;">Your daily activities will appear here.</p>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="/bas_portal" class="nav-item active">
        <i class="fas fa-grid-2"></i>
        <i class="fas fa-house-chimney"></i>
        <span>Home</span>
    </a>
    <a href="#" class="nav-item">
        <i class="fas fa-fingerprint"></i>
        <span>Attendance</span>
    </a>
    <a href="#" class="nav-item" onclick="frappe.set_route('List', 'Bas Post')">
        <i class="fas fa-comment-dots"></i>
        <span>Feed</span>
    </a>
    <a href="#" class="nav-item">
        <i class="fas fa-sliders"></i>
        <span>Config</span>
    </a>
</nav>

{% endblock %}

{% block script %}
<script>
    let deferredPrompt;

    document.addEventListener('DOMContentLoaded', function() {
        // Load initial data
        loadUserData();
        checkTodayStatus();

        // Check-in logic
        document.getElementById('checkin-btn').addEventListener('click', function() {
            handleCheckIn();
        });

        // Set Date
        const d = new Date();
        const options = { weekday: 'short', day: 'numeric', month: 'short' };
        document.getElementById('current-date').innerText = d.toLocaleDateString('en-US', options);

        // PWA Install logic
        const installBtn = document.getElementById('install-pwa');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
            frappe.show_alert({message: 'App installed successfully!', indicator: 'green'});
        });
    });

    function loadUserData() {
        frappe.call({
            method: 'bas.bas.bas_api.user_details',
            callback: function(r) {
                if(r.message && r.message.status) {
                    const data = r.message.data;
                    document.getElementById('user-name').innerText = 'Hi, ' + (data.full_name.split(' ')[0] || 'User');
                    if(data.user_image) {
                        document.getElementById('user-avatar').src = data.user_image;
                    }
                }
            }
        });
    }

    function checkTodayStatus() {
        frappe.call({
            method: 'bas.bas.bas_api.employee_checkin_status',
            callback: function(r) {
                if(r.message && r.message.status) {
                    toggleCheckInUI(true);
                } else {
                    toggleCheckInUI(false);
                }
            }
        });
    }

    function handleCheckIn() {
        const btn = document.getElementById('checkin-btn');
        const isCheckingIn = !btn.classList.contains('checked');
        
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const latlong = position.coords.latitude + "," + position.coords.longitude;
                
                frappe.call({
                    method: 'bas.bas.bas_api.employee_checkin',
                    args: {
                        log_type: isCheckingIn ? 'IN' : 'OUT',
                        latlong: latlong,
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    },
                    callback: function(r) {
                        if(r.message && r.message.status) {
                            toggleCheckInUI(isCheckingIn);
                            frappe.show_alert({
                                message: `Successfully Checked ${isCheckingIn ? 'In' : 'Out'}`, 
                                indicator: isCheckingIn ? 'green' : 'orange'
                            });
                        }
                    }
                });
            }, function(error) {
                frappe.msgprint(__('Location access is required for check-in. Please enable GPS.'));
            }, { enableHighAccuracy: true });
        }
    }

    function toggleCheckInUI(isCheckedIn) {
        const btn = document.getElementById('checkin-btn');
        const status = document.getElementById('work-status');
        if(isCheckedIn) {
            btn.classList.add('checked');
            btn.querySelector('span').innerText = 'Check Out';
            status.innerText = 'On Duty';
            status.style.color = 'var(--accent)';
            status.style.background = 'rgba(16, 185, 129, 0.15)';
        } else {
            btn.classList.remove('checked');
            btn.querySelector('span').innerText = 'Check In';
            status.innerText = 'Off Duty';
            status.style.color = 'var(--danger)';
            status.style.background = 'rgba(239, 68, 68, 0.15)';
        }
    }

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/assets/bas/js/sw.js').then(reg => {
                console.log('SW registered');
            }).catch(err => {
                console.log('SW registration failed', err);
            });
        });
    }
</script>
{% endblock %}
